services:
  - type: web
    name: school-questions-website
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: APP_DATA_DIR
        value: /var/data/data
      - key: APP_UPLOAD_DIR
        value: /var/data/uploads
      - key: SCHOOL_EMAIL_DOMAIN
        value: stececile.ca
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: school-question-data
      mountPath: /var/data
      sizeGB: 1
